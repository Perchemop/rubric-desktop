[package]
name = "crash-report"
version = "0.4.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Shared crash/bug reporting for Rubric: panic hook, diagnostics capture, optional GitHub issue submission."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# uuid was removed: the ureq 3 migration dropped the last direct use.
# MIT OR Apache-2.0. Small synchronous HTTP client: the app has its own event
# loop, so no async runtime is needed for a one-shot issue submission.
ureq = { version = "3", features = ["json"] }
