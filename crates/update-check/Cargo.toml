[package]
name = "update-check"
version = "0.4.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Shared update checking for Rubric suite apps: GitHub Releases API, version comparison, fail-soft offline."

[dependencies]
minisign-verify = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
