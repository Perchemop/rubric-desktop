<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Rubric logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3160"/>
      <stop offset="1" stop-color="#12142A"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A45"/>
      <stop offset="1" stop-color="#E23A2E"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF1F8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Rounded app tile -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>

  <!-- Document page with folded corner -->
  <g filter="url(#soft)">
    <path d="M150 96 h150 l64 64 v256 a24 24 0 0 1 -24 24 H150 a24 24 0 0 1 -24 -24 V120 a24 24 0 0 1 24 -24 z"
          fill="url(#page)"/>
    <path d="M300 96 l64 64 h-64 z" fill="#C9CFE2"/>
  </g>

  <!-- Faint content rules -->
  <g stroke="#C9CFE2" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <line x1="166" y1="196" x2="322" y2="196"/>
    <line x1="166" y1="236" x2="292" y2="236"/>
  </g>

  <!-- Rubric mark: red check + underline -->
  <g fill="none" stroke="url(#mark)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170 300 l40 42 l96 -118" stroke-width="30"/>
    <path d="M166 388 q94 -34 190 6" stroke-width="26"/>
  </g>
</svg>
