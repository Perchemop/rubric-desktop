name: Lock update

# Regenerates Cargo.lock on the checked-out ref (guide §4 pattern: heavy work
# in Actions, artefact downloaded locally) and uploads it so a stale lock can
# be committed without ever running cargo on a local machine. The resolution
# is minimal: `cargo metadata` completes missing entries without upgrading
# pinned versions.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
    - name: Resolve the workspace graph (completes Cargo.lock minimally)
      run: cargo metadata --format-version 1 > /dev/null
    - name: Upload Cargo.lock
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: cargo-lock
        path: Cargo.lock
        if-no-files-found: error
