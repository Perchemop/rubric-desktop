name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
    - name: Check formatting
      run: cargo fmt --all -- --check
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
    - name: Clippy (no warnings)
      run: cargo clippy -- -D warnings
    - name: Fetch PDFium runtime (PDF import tests bind to it at run time)
      run: |
        curl -fsSL -o /tmp/pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7881/pdfium-linux-x64.tgz"
        mkdir -p "$HOME/pdfium"
        tar -xzf /tmp/pdfium.tgz -C "$HOME/pdfium"
    - name: Tests (default features)
      run: cargo test --all
      env:
        RUBRIC_PDFIUM_PATH: /home/runner/pdfium/lib
    - name: Tests (with hayro feature)
      run: cargo test --all --features hayro
    - name: Build release
      run: cargo build --release

  # Packaging declaration check (guide §4): dist-workspace.toml resolves to a
  # concrete artefact list; a broken definition fails the pull request instead
  # of the release tag. The release workflow is regenerated by `dist init`.
  packaging-plan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install cargo-dist (pinned)
      run: |
        curl --proto '=https' --tlsv1.2 -LsSf \
          https://github.com/axodotdev/cargo-dist/releases/download/v0.33.1/cargo-dist-installer.sh | sh
    - name: Plan the release artefacts
      run: dist plan --output-format=json
