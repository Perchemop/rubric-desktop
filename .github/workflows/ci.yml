name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Clippy (no warnings)
      run: cargo clippy -- -D warnings
    - name: Tests
      run: cargo test --all
    - name: Build release
      run: cargo build --release
