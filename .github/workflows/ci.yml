name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
    - name: Check formatting
      run: cargo fmt --all -- --check
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
    - name: Clippy (no warnings)
      run: cargo clippy -- -D warnings
    - name: Fetch PDFium runtime (PDF import tests bind to it at run time)
      run: |
        curl -fsSL -o /tmp/pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7881/pdfium-linux-x64.tgz"
        mkdir -p "$HOME/pdfium"
        tar -xzf /tmp/pdfium.tgz -C "$HOME/pdfium"
    - name: Tests
      run: cargo test --all
      env:
        RUBRIC_PDFIUM_PATH: /home/runner/pdfium/lib
    - name: Build release
      run: cargo build --release
