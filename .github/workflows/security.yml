# Security checks — secret scanning, personal-data scanning, dependency
# licence/advisory review, SBOM, and SAST. Extends the CI design (Part I §4)
# per the security requirements adopted from opensource.guide (guide Part II
# §20.7) and the mandatory personal-data gate (guide II.29, owner directive
# 2026-10-27): a gap here is treated like a broken CI — fix it before feature
# work.

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full pass (CodeQL + SBOM) even without activity.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # Secret detection over tracked content — no third-party action, so the
  # security gate itself adds no supply-chain surface. Push protection is
  # enabled at repository level and catches the push-time case.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan tracked files for credential patterns
        run: bash scripts/scan-secrets.sh

  # Personal-data gate (guide II.29, owner directive 2026-10-27): fails when a
  # real-looking home path or email is committed. A required check, so a leak
  # cannot merge.
  personal-data:
    name: Personal data scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan tracked files for personal data
        run: bash scripts/scan-personal-data.sh
      # The scanners are the gate, so prove they actually detect a planted
      # leak and accept a synthetic/CI value — otherwise a green check proves
      # nothing.
      - name: Scanner self-test
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/clean" "$tmp/leak" "$tmp/dist" "$tmp/pkg"
          # Build the planted home path at runtime so this workflow file is not
          # itself a false positive for the scan it contains.
          p="/home"
          printf 'contact dev@example.com\nCI path /home/runner/work/app\n' > "$tmp/clean/ok.txt"
          printf 'author %s/leaky-user/secret\n' "$p" > "$tmp/leak/bad.txt"
          bash scripts/scan-personal-data.sh --path "$tmp/clean" >/dev/null
          if bash scripts/scan-personal-data.sh --path "$tmp/leak" >/dev/null; then
            echo "self-test: personal-data scan missed a planted leak" >&2; exit 1
          fi
          printf 'ok /home/runner/x\n' > "$tmp/pkg/readme.txt"
          tar -czf "$tmp/dist/clean.tar.gz" -C "$tmp/pkg" .
          bash scripts/scan-release-assets.sh "$tmp/dist" >/dev/null
          printf 'bad %s/leaky-user/x\n' "$p" > "$tmp/pkg/readme.txt"
          tar -czf "$tmp/dist/leak.tar.gz" -C "$tmp/pkg" .
          if bash scripts/scan-release-assets.sh "$tmp/dist" >/dev/null; then
            echo "self-test: release-asset scan missed a planted leak" >&2; exit 1
          fi
          echo "scanner self-test: ok"

  # PR-time dependency review: fails when new dependencies carry licences we
  # ban or known vulnerabilities (GitHub advisory database).
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          # Ban-strong-copyleft mirrors AGENTS.md; allow list details live in
          # deny.toml which also gates every main-branch push.
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  # Licence classes + advisory database over the whole workspace, gated on
  # every push and PR (deny.toml is the policy of record).
  cargo-deny:
    name: Cargo deny (licences, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --workspace

  # Software Bill of Materials (legally mandated in some jurisdictions,
  # requested in procurement; Part II §19.4). SPDX + CycloneDX of the
  # dependency tree, attached as artefacts.
  sbom:
    name: SBOM (SPDX + CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          file: ./Cargo.lock
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          file: ./Cargo.lock

  # Static analysis (SAST) over first-party Rust code. Scheduled + main
  # pushes rather than PRs: findings surface here first and are triaged in
  # review (Part II §20.2), so the required PR check stays "check".
  codeql:
    if: github.event_name != 'pull_request'
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build for extraction
        run: cargo build --workspace --all-features
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:rust"
