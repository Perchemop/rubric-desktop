name: Release

# Runs on version tags and on manual dispatch, so a release never depends on a
# human remembering the local build steps (the machine here is constrained).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      # Per-release token count for the guide §12.1 ledger. Honest default 0;
      # the maintainer supplies the figure when it is known.
      release_tokens:
        description: "Tokens consumed by this release (for docs/tokens.json)"
        required: false
        default: "0"

permissions:
  contents: write
  # The token-ledger step opens a PR (main is protected), so it needs this too.
  pull-requests: write

jobs:
  # Builds the release binary and uploads per-target zips as artefacts.
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: rubric-linux-x86_64
            archive: zip
            pdfium_url: "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7881/pdfium-linux-x64.tgz"
            pdfium_name: "libpdfium.so"
          # ARM Linux (Raspberry Pi OS, ARM Chromebooks, Linux-on-Apple-silicon
          # boxes). GitHub's free ARM runners make this native rather than an
          # emulated cross-build. No PDFium pre-built for aarch64 → build with
          # the pure-Rust `hayro` engine instead.
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: rubric-linux-arm64
            archive: zip
            features: hayro
            pdfium_url: ""
            pdfium_name: ""
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            asset: rubric-macos-arm64
            archive: zip
            pdfium_url: "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7881/pdfium-mac-arm64.tgz"
            pdfium_name: "libpdfium.dylib"
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: rubric-windows-x86_64
            archive: zip
            pdfium_url: "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7881/pdfium-win-x64.tgz"
            pdfium_name: "pdfium.dll"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev libwayland-dev libxcb-shm0-dev \
            libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - name: Fetch PDFium runtime (pinned; bundled into the zip)
        if: ${{ matrix.pdfium_url != '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/pdfium.tgz "${{ matrix.pdfium_url }}"
          mkdir -p "$HOME/pdfium"
          tar -xzf /tmp/pdfium.tgz -C "$HOME/pdfium"

      # The release build is the same code CI already proved green; this only
      # packages it, so no test re-run is needed here.
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --features "${{ matrix.features || '' }}"

      - name: Prepare artifact (${{ matrix.name }})
        shell: bash
        run: |
          set -euo pipefail
          STAGE="${{ matrix.asset }}"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          # Copy the binary whatever cargo called it (rubric on Unix, rubric.exe
          # on Windows). Fail loudly rather than packaging a missing binary.
          BIN=""
          for cand in "target/${{ matrix.target }}/release/rubric" \
                      "target/${{ matrix.target }}/release/rubric.exe"; do
            if [ -f "$cand" ]; then BIN="$cand"; break; fi
          done
          if [ -z "$BIN" ]; then
            echo "no release binary found under target/${{ matrix.target }}/release" >&2
            ls -la "target/${{ matrix.target }}/release" >&2 || true
            exit 1
          fi
          echo "packaging binary: $BIN"
          cp "$BIN" "$STAGE/"
          cp README.md "$STAGE/" 2>/dev/null || true
          cp LICENSE "$STAGE/" 2>/dev/null || true
          cp ATTRIBUTION.md "$STAGE/" 2>/dev/null || true
          # Bundle the PDFium runtime for targets that have a pre-built.
          # For linux-arm64 (built with hayro), no PDFium is needed.
          if [[ -n "${{ matrix.pdfium_name }}" ]]; then
            PDFIUM=$(find "$HOME/pdfium" /usr/lib /opt/homebrew/lib /usr/local/lib \
              -name "${{ matrix.pdfium_name }}*" 2>/dev/null | head -1 || true)
            test -n "$PDFIUM" || {
              echo "PDFium library not found for ${{ matrix.name }} (searched for ${{ matrix.pdfium_name }})" >&2
              exit 1
            }
            echo "bundling PDFium: $PDFIUM"
            cp "$PDFIUM" "$STAGE/"
          fi
          # Always produce a real .zip named for the asset. `zip` exists on the
          # Unix runners; Windows runners have it in neither bash nor on PATH,
          # so fall back to PowerShell's Compress-Archive. Every branch reports
          # what it is doing, so a failure is diagnosable from the log.
          OUT="${{ matrix.asset }}.zip"
          rm -f "$OUT"
          if command -v zip >/dev/null 2>&1; then
            echo "using zip"
            (cd "$STAGE" && zip -qr "../$OUT" .)
          else
            echo "using powershell Compress-Archive"
            powershell.exe -NoProfile -Command \
              "Compress-Archive -Path '$STAGE' -DestinationPath '$OUT' -Force" \
              || powershell -NoProfile -Command \
              "Compress-Archive -Path '$STAGE' -DestinationPath '$OUT' -Force"
          fi
          test -f "$OUT"
          ls -la "$OUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip
          if-no-files-found: error

  # Attaches the built artefacts to the GitHub release for the version tag.
  # `workflow_dispatch` runs (no tag) publish as a pre-release so a manual run
  # never looks like a real release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    steps:
      # `gh release create` resolves the repository from the git remote, so the
      # job must have a checkout even though it never builds anything.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # Wait for the sibling package.yml workflow (installers) for this tag,
      # then download its artefacts so they ship on the same release.
      - name: Wait for package workflow (installers)
        id: package-wait
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            run_id=$(gh run list --workflow package.yml --branch ${{ github.ref_name }} --json databaseId,status,conclusion --jq '[.[] | select(.status == "completed")] | .[0].databaseId // empty' 2>/dev/null || true)
            if [ -n "$run_id" ]; then
              conclusion=$(gh run view "$run_id" --json conclusion --jq '.conclusion' 2>/dev/null || true)
              if [ "$conclusion" = "success" ]; then
                echo "package workflow $run_id succeeded"
                echo "package_run_id=$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              elif [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ]; then
                echo "package workflow $run_id failed with $conclusion" >&2
                exit 1
              fi
            fi
            echo "waiting for package workflow... ($i/60)"
            sleep 10
          done
          echo "package workflow did not complete in time" >&2
          exit 1

      - name: Download package artefacts (installers)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id="${{ steps.package-wait.outputs.package_run_id }}"
          for artifact in linux-packages windows-packages macos-packages; do
            echo "downloading $artifact..."
            gh run download "$run_id" --name "$artifact" --dir "dist/packages/$artifact" || echo "WARNING: could not download $artifact"
          done
          ls -laR dist/packages/ 2>/dev/null || true

      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          files=$(find dist -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' \) | sort)
          # Checksums (guide §4, §6.3): one SHA256SUMS file over every archive.
          : > dist/SHA256SUMS
          for f in $files; do
            (cd "$(dirname "$f")" && sha256sum "$(basename "$f")") >> dist/SHA256SUMS
          done
          # SHA256SUMS.txt is a byte-identical copy under the guide §12.1
          # literal name; it is the file the minisign signature covers (see
          # docs/research/signed-releases.md). SHA256SUMS stays published for
          # backward compatibility.
          cp dist/SHA256SUMS dist/SHA256SUMS.txt
          cat dist/SHA256SUMS
          {
            echo "files<<EOF"
            for f in $files dist/SHA256SUMS dist/SHA256SUMS.txt; do echo "$f"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Pinned by version only: upstream publishes no stable checksum file,
      # just .minisig files signed with the author's key, and fetching that
      # key here would add a bootstrap trust dependency. Add a checksum pin
      # once upstream publishes stable checksums.
      - name: Install minisign (pinned)
        run: |
          set -euo pipefail
          # The tarball unpacks to minisign-linux/<arch>/minisign. These
          # release runners are x86_64 (ubuntu-latest) — unlike the aarch64
          # machine the key was generated on — so select the x86_64 binary
          # explicitly.
          curl --fail --silent --show-error --location \
            --output /tmp/minisign.tar.gz \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          tar -xzf /tmp/minisign.tar.gz -C /tmp
          sudo install -m 0755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
          rm -rf /tmp/minisign-linux /tmp/minisign.tar.gz
          minisign -v

      - name: Sign the checksum manifest
        env:
          # The secret holds the whole minisign key FILE (untrusted-comment
          # line included), not just the base64 body. The password reaches
          # minisign via the env var and is never echoed.
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          # Hard fail: a release without a signature must not ship silently.
          if [[ -z "${MINISIGN_SECRET_KEY}" || -z "${MINISIGN_PASSWORD}" ]]; then
            echo "ERROR: release signing secrets are not configured — see docs/research/signed-releases.md" >&2
            echo "Configure the MINISIGN_SECRET_KEY repository secret (the full minisign key" >&2
            echo "file, including its untrusted-comment line) and MINISIGN_PASSWORD." >&2
            exit 1
          fi
          printf '%s' "${MINISIGN_SECRET_KEY}" > /tmp/release.key
          chmod 600 /tmp/release.key
          trap 'rm -f /tmp/release.key' EXIT
          # minisign reads the passphrase from MINISIGN_PASSWORD; the stdin
          # pipe is a fallback for builds that take it from stdin instead.
          printf '%s' "${MINISIGN_PASSWORD}" | minisign -S -s /tmp/release.key -m dist/SHA256SUMS.txt
          test -f dist/SHA256SUMS.txt.minisig
          ls -la dist/SHA256SUMS.txt.minisig

      - name: Scan release assets for personal data (guide II.29.3/II.29.6)
        run: bash scripts/scan-release-assets.sh dist

      - name: Build release notes
        id: notes
        shell: bash
        env:
          RELEASE_TOKENS: ${{ inputs.release_tokens || vars.RELEASE_TOKENS || '0' }}
        run: |
          set -euo pipefail
          # Release notes come from CHANGELOG (guide §6.3): the section matching
          # this tag when present, otherwise an honest fallback. The rule lives
          # in a small in-repo script so it is reviewable and testable. The token
          # block references the ledger (guide §12.1).
          {
            echo "body<<CHANGELOG_EOF"
            python3 scripts/release-notes.py "${GITHUB_REF_NAME#v}" || true
            echo
            python3 scripts/token-summary.py "${GITHUB_REF_NAME#v}" "${RELEASE_TOKENS}" || true
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Token metrics (guide §12.1): record the tag's per-release token count in
      # docs/tokens.json. The count is supplied via the `release_tokens`
      # dispatch input or the `RELEASE_TOKENS` repository variable; it defaults
      # to 0 rather than fabricating a number. `main` is a protected branch, so
      # the ledger update is committed on a short-lived branch and merged via a
      # PR; bookkeeping never blocks the release itself.
      - name: Record token metrics for the tag (guide §12.1)
        id: tokens
        if: ${{ github.ref_type == 'tag' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TOKENS: ${{ inputs.release_tokens || vars.RELEASE_TOKENS || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          git config user.name "Rubric Dev"
          git config user.email "dev@example.com"
          git fetch origin main
          git checkout -B "chore/token-ledger-${tag}" origin/main
          python3 scripts/update-token-ledger.py "${tag}" "${RELEASE_TOKENS}"
          git add docs/tokens.json
          if git diff --cached --quiet; then
            echo "ledger already records ${tag}; nothing to commit"
            exit 0
          fi
          git commit -m "chore(release): record token metrics for ${tag}"
          git push --force origin "HEAD:chore/token-ledger-${tag}"
          gh pr create \
            --base main \
            --head "chore/token-ledger-${tag}" \
            --title "chore(release): token metrics for ${tag}" \
            --body "Automated guide §12.1 token-ledger update for ${tag} (${RELEASE_TOKENS} tokens)." \
            || echo "PR already exists for chore/token-ledger-${tag}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_BODY: ${{ steps.notes.outputs.body }}
          # Newline-separated list of artefacts. Read into an array below rather
          # than substituted straight into the shell: a multi-line value placed
          # directly in a `run:` block is re-parsed as shell source, which makes
          # the shell try to *execute* the path (exit 126, Permission denied).
          ARTEFACTS: ${{ steps.collect.outputs.files }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            [[ "$tag" == refs/* ]] && tag="${GITHUB_REF#refs/tags/}"
            prerelease=()
          else
            # A manual dispatch has no version to name. Reusing a branch name
            # here would create a tag that collides with that branch, so the
            # run gets its own clearly-not-a-release tag instead.
            tag="dispatch-$(date -u +%Y%m%d-%H%M%S)"
            prerelease=(--prerelease)
          fi
          # Fall back to an honest one-liner when the CHANGELOG has no entry.
          if [[ -z "${NOTES_BODY//[[:space:]]/}" ]]; then
            NOTES_BODY="Automated release build for Rubric ${tag}."
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            if [[ "${#prerelease[@]}" -gt 0 ]]; then
              # A manual dispatch is not a real release: keep it a pre-release so
              # "Latest release" on the repo still points at a tagged version.
              gh release create "$tag" --title "Rubric ${tag}" --notes "$NOTES_BODY" "${prerelease[@]}"
            else
              gh release create "$tag" --title "Rubric ${tag}" --notes "$NOTES_BODY"
            fi
          else
            echo "release $tag already exists; uploading assets"
          fi
          # --clobber makes re-runs idempotent: existing assets with the same
          # name are replaced, missing ones are created. Read the artefact list
          # into an array so newline-separated values survive as data.
          # array so newline-separated values survive as data, not source.
          mapfile -t artefacts <<< "$ARTEFACTS"
          # The minisign signature is produced after "Collect artifacts" froze
          # its list, so add it here. Signing hard-fails when the secrets are
          # missing, so the file always exists by the time this step runs.
          artefacts+=("dist/SHA256SUMS.txt.minisig")
          gh release upload "$tag" "${artefacts[@]}" --clobber
          # If the release exists as a draft (e.g. its tag was deleted and the
          # re-created tag made GitHub turn it into one), finalise it so the
          # upload actually amounts to publishing.
          gh release edit "$tag" --draft=false
