name: Release

# Runs on version tags and on manual dispatch, so a release never depends on a
# human remembering the local build steps (the machine here is constrained).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Builds the release binary and uploads per-target zips as artefacts.
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: rubric-linux-x86_64
            archive: zip
          # ARM Linux (Raspberry Pi OS, ARM Chromebooks, Linux-on-Apple-silicon
          # boxes). GitHub's free ARM runners make this native rather than an
          # emulated cross-build.
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: rubric-linux-arm64
            archive: zip
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            asset: rubric-macos-arm64
            archive: zip
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: rubric-windows-x86_64
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev libwayland-dev libxcb-shm0-dev \
            libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The release build is the same code CI already proved green; this only
      # packages it, so no test re-run is needed here.
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Prepare artifact (${{ matrix.name }})
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/rubric"
          if [ ! -f "$BIN" ] && [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          STAGE="${{ matrix.asset }}"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/"
          cp README.md "$STAGE/" 2>/dev/null || true
          cp LICENSE "$STAGE/" 2>/dev/null || true
          cp ATTRIBUTION.md "$STAGE/" 2>/dev/null || true
          # PDFium is a run-time dependency (see Cargo.toml): ship the doc that
          # explains discovery instead of a binary blob.
          cp docs/pdfium.md "$STAGE/" 2>/dev/null || true
          # Always produce a real .zip named for the asset: `zip` where present,
          # else 7-Zip, else PowerShell's Compress-Archive (Windows runners have
          # no `zip` in their bash). Renaming a .tar.gz to .zip would produce an
          # archive most tools reject, so that "fallback" is not an option.
          if command -v zip >/dev/null 2>&1; then
            (cd "$STAGE" && zip -qr "../${{ matrix.asset }}.zip" .)
          elif command -v 7z >/dev/null 2>&1; then
            7z a -tzip "../${{ matrix.asset }}.zip" "./$STAGE" >/dev/null
          elif command -v powershell.exe >/dev/null 2>&1; then
            powershell.exe -NoProfile -Command \
              "Compress-Archive -Path '$STAGE/*' -DestinationPath '${{ matrix.asset }}.zip' -Force"
          else
            echo "no zip tooling found on this runner" >&2
            exit 1
          fi
          test -f "${{ matrix.asset }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip
          if-no-files-found: error

  # Attaches the built artefacts to the GitHub release for the version tag.
  # `workflow_dispatch` runs (no tag) publish as a pre-release so a manual run
  # never looks like a real release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    steps:
      # `gh release create` resolves the repository from the git remote, so the
      # job must have a checkout even though it never builds anything.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          files=$(find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) | sort)
          # Checksums (guide §4, §6.3): one SHA256SUMS file over every archive.
          : > dist/SHA256SUMS
          for f in $files; do
            (cd "$(dirname "$f")" && sha256sum "$(basename "$f")") >> dist/SHA256SUMS
          done
          cat dist/SHA256SUMS
          {
            echo "files<<EOF"
            for f in $files dist/SHA256SUMS; do echo "$f"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          # Release notes come from CHANGELOG (guide §6.3): the section matching
          # this tag when present, otherwise an honest fallback. The rule lives
          # in a small in-repo script so it is reviewable and testable.
          {
            echo "body<<CHANGELOG_EOF"
            python3 scripts/release-notes.py "${GITHUB_REF_NAME#v}" || true
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_BODY: ${{ steps.notes.outputs.body }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            [[ "$tag" == refs/* ]] && tag="${GITHUB_REF#refs/tags/}"
            prerelease=()
          else
            # A manual dispatch has no version to name. Reusing a branch name
            # here would create a tag that collides with that branch, so the
            # run gets its own clearly-not-a-release tag instead.
            tag="dispatch-$(date -u +%Y%m%d-%H%M%S)"
            prerelease=(--prerelease)
          fi
          # Fall back to an honest one-liner when the CHANGELOG has no entry.
          if [[ -z "${NOTES_BODY//[[:space:]]/}" ]]; then
            NOTES_BODY="Automated release build for Rubric ${tag}."
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            if [[ "${#prerelease[@]}" -gt 0 ]]; then
              # A manual dispatch is not a real release: keep it a pre-release so
              # "Latest release" on the repo still points at a tagged version.
              gh release create "$tag" --title "Rubric ${tag}" --notes "$NOTES_BODY" "${prerelease[@]}"
            else
              gh release create "$tag" --title "Rubric ${tag}" --notes "$NOTES_BODY"
            fi
          else
            echo "release $tag already exists; uploading assets"
          fi
          # --clobber makes re-runs idempotent.
          gh release upload "$tag" ${{ steps.collect.outputs.files }} --clobber
