[package]
name = "rubric"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Rubric — free, cross-platform PDF markup, review & measurement."
license = "MIT"
readme = "../../README.md"
default-run = "rubric"
repository = "https://github.com/Perchemop/rubric-desktop"

[dependencies]
eframe = "0.36"
egui = "0.36"
egui_extras = "0.36"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
# MIT OR Apache-2.0. Bindings only: the PDFium shared library (BSD-3-Clause)
# is located at run time (RUBRIC_PDFIUM_PATH / exe dir / system), so builds
# stay pure Rust. See DECISIONS.md 2026-10-20 (PDF crate choice).
pdfium-render = "0.9"
# Shared suite crates (guide §7): crash reporting and update checks.
# Explicit `version` alongside `path`: cargo-deny treats a versionless
# dependency spec as a wildcard, which the dependency-hygiene gate forbids.
crash-report = { path = "../../crates/crash-report", version = "0.1.0" }
update-check = { path = "../../crates/update-check", version = "0.1.0" }
